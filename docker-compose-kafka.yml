services:
  product:
    build: microservices/product-service
    mem_limit: 512m
    environment:
    - SPRING_PROFILES_ACTIVE=docker,streaming_partitioned,streaming_instance_0,kafka
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka:
        condition: service_started
  product-p1:
    build: microservices/product-service
    mem_limit: 512m
    environment:
    - SPRING_PROFILES_ACTIVE=docker,streaming_partitioned,streaming_instance_1,kafka
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka:
        condition: service_started
  recommendation:
    build: microservices/recommendation-service
    mem_limit: 512m
    environment:
    - SPRING_PROFILES_ACTIVE=docker,streaming_partitioned,streaming_instance_0,kafka
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka:
        condition: service_started
  recommendation-p1:
    build: microservices/recommendation-service
    mem_limit: 512m
    environment:
    - SPRING_PROFILES_ACTIVE=docker,streaming_partitioned,streaming_instance_1,kafka
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka:
        condition: service_started
  review:
    build: microservices/review-service
    mem_limit: 512m
    environment:
    - SPRING_PROFILES_ACTIVE=docker,streaming_partitioned,streaming_instance_0,kafka
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka:
        condition: service_started
  review-p1:
    build: microservices/review-service
    mem_limit: 512m
    environment:
    - SPRING_PROFILES_ACTIVE=docker,streaming_partitioned,streaming_instance_1,kafka
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka:
        condition: service_started
  product-composite:
    build: microservices/product-composite-service
    mem_limit: 512m
    ports:
    - 8080:8080
    environment:
    - SPRING_PROFILES_ACTIVE=docker,streaming_partitioned,kafka
    depends_on:
      kafka:
        condition: service_started
      eureka:
        condition: service_started
  mongodb:
    image: mongo:8.0.5
    mem_limit: 512m
    ports:
    - 127.0.0.1:27017:27017
    command: mongod
    volumes:
    - mongodb-data:/data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'
      interval: 5s
      timeout: 2s
      retries: 60
  mysql:
    image: mysql:9.2.0
    mem_limit: 512m
    ports:
    - 127.0.0.1:3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: review-db
      MYSQL_USER: user
      MYSQL_PASSWORD: pwd
    volumes:
    - mysql-data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mysql --protocol=TCP -h 127.0.0.1 --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD
        --database=$$MYSQL_DATABASE --execute='SELECT 1'
      interval: 5s
      timeout: 2s
      retries: 60
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    restart: always
    mem_limit: 1024m
    ports:
    - 127.0.0.1:9092:9092
    environment:
    - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
    - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    - KAFKA_BROKER_ID=1
    - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
    - zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    restart: always
    mem_limit: 512m
    ports:
    - 127.0.0.1:2181:2181
    environment:
    - ZOOKEEPER_CLIENT_PORT=2181
  eureka:
    build: spring-cloud/eureka-server
    mem_limit: 512m
    ports:
    - 8761:8761
volumes:
  mongodb-data: null
  mysql-data: null
