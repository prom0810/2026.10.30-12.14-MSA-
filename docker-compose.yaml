services:
  product:
    build: microservices/product-service
    mem_limit: 512m
    environment:
    - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started
  recommendation:
    build: microservices/recommendation-service
    mem_limit: 512m
    environment:
    - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started
  review:
    build: microservices/review-service
    mem_limit: 512m
    environment:
    - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started
  product-composite:
    build: microservices/product-composite-service
    mem_limit: 512m
    ports:
    - 8080:8080
    environment:
    - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started
  mongodb:
    image: mongo:8.0.5
    mem_limit: 512m
    ports:
    - 127.0.0.1:27017:27017
    command: mongod
    volumes:
    - mongodb-data:/data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'
      interval: 5s
      timeout: 2s
      retries: 60
  mysql:
    image: mysql:9.2.0
    mem_limit: 512m
    ports:
    - 127.0.0.1:3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: review-db
      MYSQL_USER: user
      MYSQL_PASSWORD: pwd
    volumes:
    - mysql-data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mysql --protocol=TCP -h 127.0.0.1 --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD
        --database=$$MYSQL_DATABASE --execute='SELECT 1'
      interval: 5s
      timeout: 2s
      retries: 60
  rabbitmq:
    image: rabbitmq:4.0.7-management
    mem_limit: 512m
    ports:
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672
    healthcheck:
      test:
      - CMD
      - rabbitmqctl
      - status
      interval: 5s
      timeout: 2s
      retries: 60
  eureka:
    build: spring-cloud/eureka-server
    mem_limit: 512m
    ports:
    - 8761:8761
volumes:
  mongodb-data: null
  mysql-data: null
