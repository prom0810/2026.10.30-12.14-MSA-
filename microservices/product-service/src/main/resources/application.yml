spring:
  mongodb:
    host: localhost
    port: 27017
    database: product-db
  data:
    mongodb:
      auto-index-creation: true
  application:
    name: product-service
  web:
    error:
      include-message: always

server:
  port: 7002

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    root: INFO
    se.magnus.microservices: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  mongodb:
    host: mongodb

server:
  port: 8080


